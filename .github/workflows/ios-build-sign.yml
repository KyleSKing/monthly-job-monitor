name: Build & Sign iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Install XcodeGen
      run: |
        cd mobile-ios
        gem install xcodegen
        xcodegen generate
        
    - name: Install CocoaPods
      run: |
        cd mobile-ios
        pod install --repo-update
        
    - name: Create ExportOptions.plist
      run: |
        cat > mobile-ios/ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>AUTO</string>
            <key>signingStyle</key>
            <string>automatic</string>
        </dict>
        </plist>
        EOF
        
    - name: Archive
      run: |
        cd mobile-ios
        xcodebuild -workspace JobMonitorApp.xcworkspace \
          -scheme JobMonitorApp \
          -configuration Release \
          -archivePath build/JobMonitorApp.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyID "" \
          -authenticationKeyIssuerID "" \
          archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          
    - name: Export IPA
      run: |
        cd mobile-ios
        xcodebuild -exportArchive \
          -archivePath build/JobMonitorApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: JobMonitorApp-ipa
        path: mobile-ios/build/JobMonitorApp.ipa
        retention-days: 30
