# Monthly Job Monitor - GitHub Actions Workflow
# Runs on the 1st of every month at 8:00 AM UTC

name: Monthly Job Scraping

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run with debug output'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/monthly-scrape.yml'

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run job scraper
        env:
          CONFIG_PATH: ${{ github.workspace }}/config.yaml
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIRECRAWL_TOKEN: ${{ secrets.FIRECRAWL_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -m src.scraper.main
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-report
          path: reports/
          retention-days: 30

      - name: Commit report
        run: |
          mkdir -p reports
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          git diff --staged --quiet || git commit -m "Add recruitment report $(date +%Y-%m)"
          git push

  notify-failure:
    needs: scrape-and-send
    runs-on: ubuntu-latest
    steps:
      - name: Print failure notice
        if: failure()
        run: |
          echo "::error::Monthly job scraping failed!"
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
