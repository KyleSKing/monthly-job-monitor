name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ipa
        uses: Irving-wang/IOS-Build-Action@main
        with:
          project_path: 'mobile-ios'
          xcodegen: 'true'
          pod_install: 'true'
          export_method: 'development'
          apple_id: '${{ secrets.APPLE_ID }}'
          password: '${{ secrets.APPLE_ID_PASSWORD }}'
          output: 'output.ipa'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JobMonitorApp-ipa
          path: output.ipa
          retention-days: 30
