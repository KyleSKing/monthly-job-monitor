name: Build iOS Project

on:
  push:
    branches: [ main, feature/* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Install XcodeGen
      run: |
        cd mobile-ios
        gem install xcodegen
        xcodegen generate
        
    - name: Install CocoaPods
      run: |
        cd mobile-ios
        pod install --repo-update
        
    - name: Build xcarchive
      run: |
        cd mobile-ios
        xcodebuild -workspace JobMonitorApp.xcworkspace -scheme JobMonitorApp -configuration Release clean archive -archivePath build/JobMonitorApp.xcarchive
        
    - name: Upload xcarchive
      uses: actions/upload-artifact@v4
      with:
        name: JobMonitorApp-xcarchive
        path: mobile-ios/build/JobMonitorApp.xcarchive
        retention-days: 30
