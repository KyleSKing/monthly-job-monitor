name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install XcodeGen via Homebrew
      run: brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        cd mobile-ios
        xcodegen generate
        
    - name: Install CocoaPods
      run: |
        cd mobile-ios
        pod install --repo-update
        
    - name: Build app
      run: |
        cd mobile-ios
        xcodebuild -workspace JobMonitorApp.xcworkspace \
          -scheme JobMonitorApp \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath build
          
    - name: Package IPA
      run: |
        cd mobile-ios
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/JobMonitorApp.app Payload/
        zip -r JobMonitorApp.ipa Payload
        rm -rf Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: JobMonitorApp-unsigned-ipa
        path: mobile-ios/JobMonitorApp.ipa
        retention-days: 30
