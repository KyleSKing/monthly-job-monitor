# Monthly Job Monitor Configuration

# 搜索关键词配置
search:
  keywords:
    - "Python Developer"
    - "Backend Engineer"
    - "Software Engineer"
    - "Data Scientist"
  
  # 搜索地点
  locations:
    - "Remote"
    - "USA"
    - "China"

# 目标网站配置
targets:
  - name: "LinkedIn"
    enabled: true
    url: "https://www.linkedin.com/jobs/search"
    keywords:
      - "software engineer"
      - "python developer"
  
  - name: "Indeed"
    enabled: true
    url: "https://www.indeed.com/jobs"
    keywords:
      - "software engineer"
      - "developer"

# 爬虫设置
crawler:
  request_delay: 2
  timeout: 30
  max_results: 50
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# 报告设置
report:
  format: "markdown"
  output_dir: "reports"
  include:
    - job_title
    - company
    - location
    - salary
    - posted_date
    - job_url