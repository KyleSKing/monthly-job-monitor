# Monthly Job Monitor 配置文件

# 可选：手动添加的额外目标（示例）
targets:
  - url: "https://careers.microsoft.com/search?keywords=security"
    parser: "generic"
  - url: "https://careers.apple.com/search?keywords=compliance"
    parser: "generic"

# Tavily 配置（可选，用于搜索前获取关键词相关职位 URL）
tavily_api_key: "[REDACTED]"  # 替换为你的 Tavily API Key
use_tavily: false             # 是否启用 Tavily 搜索

# 网络请求配置
request_delay: 1.0            # 请求间隔（秒）
timeout: 30                   # 请求超时（秒）
max_results: 50               # 每个目标最多抓取结果数