<!DOCTYPE html>
<html lang="zh-CN" data-theme="jobmonitor">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招聘监控 · Job Monitor</title>

  <!-- Tailwind CSS 4 (browser) + daisyUI 5 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

  <!-- Fonts: Poppins (heading) + Open Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Custom daisyUI theme (Job Board / Recruitment palette) -->
  <style type="text/tailwindcss">
    @plugin "daisyui/theme" {
      name: "jobmonitor";
      default: true;
      prefersdark: false;
      color-scheme: light;

      --color-base-100: #ffffff;
      --color-base-200: #f0f9ff;
      --color-base-300: #e0f2fe;
      --color-base-content: #0c4a6e;
      --color-primary: #0369a1;
      --color-primary-content: #ffffff;
      --color-secondary: #0ea5e9;
      --color-secondary-content: #0f172a;
      --color-accent: #16a34a;
      --color-accent-content: #ffffff;
      --color-neutral: #334155;
      --color-neutral-content: #ffffff;
      --color-info: #0ea5e9;
      --color-info-content: #ffffff;
      --color-success: #16a34a;
      --color-success-content: #ffffff;
      --color-warning: #d97706;
      --color-warning-content: #ffffff;
      --color-error: #dc2626;
      --color-error-content: #ffffff;

      --radius-selector: 0.5rem;
      --radius-field: 0.5rem;
      --radius-box: 0.75rem;
      --border: 1px;
    }
  </style>

  <style>
    :root { font-family: 'Open Sans', system-ui, sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Poppins', 'Open Sans', sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

<body class="min-h-screen bg-base-200 text-base-content">
  <!-- Header -->
  <header class="bg-primary text-primary-content">
    <div class="mx-auto max-w-5xl px-4 py-8">
      <div class="flex items-center gap-3">
        <!-- SVG logo mark -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="7" width="20" height="14" rx="2" />
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
        </svg>
        <h1 class="text-2xl font-bold sm:text-3xl">招聘监控报告</h1>
      </div>
      <p class="mt-1 text-sm opacity-90">Monthly Job Monitor · 每月自动爬取的信息安全岗位</p>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <!-- Stats -->
    <div id="stats" class="stats stats-vertical w-full shadow-sm sm:stats-horizontal" role="region" aria-label="报告概览">
      <div class="stat">
        <div class="stat-title">报告日期</div>
        <div id="stat-date" class="stat-value text-xl">—</div>
      </div>
      <div class="stat">
        <div class="stat-title">职位总数</div>
        <div id="stat-total" class="stat-value text-primary">—</div>
      </div>
      <div class="stat">
        <div class="stat-title">高分岗位 (评分 ≥ 7)</div>
        <div id="stat-high" class="stat-value text-accent">—</div>
      </div>
    </div>

    <!-- Filter -->
    <div class="mt-6 rounded-box bg-base-100 p-4 shadow-sm">
      <div class="flex items-center justify-between">
        <label for="score-filter" class="font-heading font-semibold">最低评分筛选</label>
        <span id="score-value" class="badge badge-primary badge-lg">0</span>
      </div>
      <input id="score-filter" type="range" min="0" max="10" value="0" step="1"
             class="range range-primary mt-3 w-full" aria-label="最低评分" />
      <div class="mt-1 flex w-full justify-between px-1 text-xs opacity-60">
        <span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span>
      </div>
    </div>

    <!-- Status / list -->
    <div id="loading" class="mt-10 flex flex-col items-center gap-3 text-base-content/70">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <span>正在加载职位数据…</span>
    </div>

    <div id="error" class="alert alert-error mt-6 hidden" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      </svg>
      <span id="error-msg">加载失败</span>
    </div>

    <p id="empty" class="mt-10 hidden text-center text-base-content/60">当前筛选条件下没有职位。</p>

    <div id="job-list" class="mt-6 space-y-3"></div>
  </main>

  <footer class="mx-auto max-w-5xl px-4 py-8 text-center text-xs text-base-content/50">
    数据来源：Monthly Job Monitor · 每月 1 日自动更新
  </footer>

  <script>
    const API_URL = '/api/latest-report';
    let allJobs = [];
    let minScore = 0;

    const $ = (id) => document.getElementById(id);

    function scoreBadgeClass(score) {
      if (score >= 7) return 'badge-accent';
      if (score >= 4) return 'badge-secondary';
      if (score >= 1) return 'badge-warning';
      return 'badge-ghost';
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function renderJobs() {
      const list = $('job-list');
      const visible = allJobs.filter((j) => (j.score ?? 0) >= minScore);
      list.innerHTML = '';
      $('empty').classList.toggle('hidden', visible.length > 0);

      for (const job of visible) {
        const score = job.score ?? 0;
        const salary = job.salaryRange || '薪资面议';
        const summary = job.summary ? escapeHtml(job.summary) : '暂无职位描述。';
        const published = job.publishedDate ? escapeHtml(job.publishedDate) : '—';
        const url = job.url || '';

        const item = document.createElement('div');
        item.className = 'collapse collapse-arrow rounded-box bg-base-100 shadow-sm';
        item.innerHTML = `
          <input type="checkbox" aria-label="展开职位详情" />
          <div class="collapse-title">
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
              <span class="badge ${scoreBadgeClass(score)} badge-lg font-semibold" title="评分">${score}</span>
              <span class="font-heading text-base font-semibold sm:text-lg">${escapeHtml(job.title || '未命名职位')}</span>
            </div>
            <div class="mt-1 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-base-content/70">
              <span>${escapeHtml(job.company || '未知公司')}</span>
              <span>· ${escapeHtml(job.location || '地点未知')}</span>
              <span class="text-accent font-medium">${escapeHtml(salary)}</span>
            </div>
          </div>
          <div class="collapse-content text-sm">
            <p class="whitespace-pre-line leading-relaxed text-base-content/80">${summary}</p>
            <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-xs text-base-content/60">
              <span>来源：${escapeHtml(job.source || 'Job Monitor')}</span>
              <span>发布：${published}</span>
              <span>评分：${score} / 10</span>
            </div>
            ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
                 class="btn btn-primary btn-sm mt-4">申请职位
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
               </a>` : '<span class="mt-4 inline-block text-xs text-base-content/40">无申请链接</span>'}
          </div>`;
        list.appendChild(item);
      }
    }

    $('score-filter').addEventListener('input', (e) => {
      minScore = Number(e.target.value);
      $('score-value').textContent = String(minScore);
      renderJobs();
    });

    async function load() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allJobs = Array.isArray(data.jobs) ? data.jobs : [];
        allJobs.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));

        $('stat-date').textContent = data.date || '—';
        $('stat-total').textContent = data.totalJobs ?? allJobs.length;
        $('stat-high').textContent = data.highScoreJobs ?? allJobs.filter((j) => (j.score ?? 0) >= 7).length;

        $('loading').classList.add('hidden');
        renderJobs();
      } catch (err) {
        $('loading').classList.add('hidden');
        $('error').classList.remove('hidden');
        $('error-msg').textContent = `加载失败：${err.message}`;
      }
    }

    load();
  </script>
</body>
</html>
