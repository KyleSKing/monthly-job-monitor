<!DOCTYPE html>
<html lang="zh-CN" data-theme="jobmonitor">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招聘监控 · Job Monitor</title>

  <!-- Tailwind CSS 4 (browser) + daisyUI 5 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

  <!-- Fonts: Poppins (heading) + Open Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Custom daisyUI theme (Job Board / Recruitment palette) -->
  <style type="text/tailwindcss">
    @plugin "daisyui/theme" {
      name: "jobmonitor";
      default: true;
      prefersdark: false;
      color-scheme: light;

      --color-base-100: #ffffff;
      --color-base-200: #f1f5f9;
      --color-base-300: #e2e8f0;
      --color-base-content: #0f172a;
      --color-primary: #0369a1;
      --color-primary-content: #ffffff;
      --color-secondary: #0ea5e9;
      --color-secondary-content: #0f172a;
      --color-accent: #16a34a;
      --color-accent-content: #ffffff;
      --color-neutral: #1e293b;
      --color-neutral-content: #ffffff;
      --color-info: #0ea5e9;
      --color-info-content: #ffffff;
      --color-success: #16a34a;
      --color-success-content: #ffffff;
      --color-warning: #d97706;
      --color-warning-content: #ffffff;
      --color-error: #dc2626;
      --color-error-content: #ffffff;

      --radius-selector: 0.75rem;
      --radius-field: 0.5rem;
      --radius-box: 1rem;
      --border: 1px;
    }
  </style>

  <style>
    :root { font-family: 'Open Sans', system-ui, sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Poppins', 'Open Sans', sans-serif; }
    .hero-gradient {
      background:
        radial-gradient(1200px 400px at 15% -20%, rgba(14,165,233,0.35), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(22,163,74,0.25), transparent 55%),
        linear-gradient(135deg, #075985 0%, #0369a1 55%, #0c4a6e 100%);
    }
    .job-card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .job-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(3,105,161,.35); border-color: var(--color-secondary); }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .job-card:hover { transform: none; }
    }
  </style>
</head>

<body class="min-h-screen bg-base-200 text-base-content">
  <!-- Hero -->
  <header class="hero-gradient text-white">
    <div class="mx-auto max-w-5xl px-4 py-12 sm:py-16">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-white/15 backdrop-blur">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="8" width="18" height="12" rx="2" />
            <path d="M15 8V6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v2" />
            <path d="M3 13h18" />
          </svg>
        </span>
        <span class="text-sm font-medium tracking-wide text-white/80">Monthly Job Monitor</span>
      </div>
      <h1 class="mt-5 max-w-2xl font-heading text-3xl font-extrabold leading-tight sm:text-4xl">
        每月精选信息安全岗位
      </h1>
      <p class="mt-3 max-w-xl text-sm text-white/80 sm:text-base">
        自动爬取、智能评分、按月更新。展开任意职位查看详情并一键申请。
      </p>

      <!-- Stats inline in hero -->
      <div id="stats" class="mt-8 grid grid-cols-3 gap-3 sm:max-w-lg" role="region" aria-label="报告概览">
        <div class="rounded-box bg-white/10 px-4 py-3 backdrop-blur">
          <div class="text-xs text-white/70">报告日期</div>
          <div id="stat-date" class="mt-0.5 font-heading text-lg font-bold">—</div>
        </div>
        <div class="rounded-box bg-white/10 px-4 py-3 backdrop-blur">
          <div class="text-xs text-white/70">职位总数</div>
          <div id="stat-total" class="mt-0.5 font-heading text-lg font-bold">—</div>
        </div>
        <div class="rounded-box bg-white/10 px-4 py-3 backdrop-blur">
          <div class="text-xs text-white/70">高分 ≥7</div>
          <div id="stat-high" class="mt-0.5 font-heading text-lg font-bold text-emerald-300">—</div>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 pb-16">
    <!-- Filter bar (overlaps hero) -->
    <div class="-mt-6 rounded-box border border-base-300 bg-base-100 p-4 shadow-lg sm:p-5">
      <div class="flex items-center justify-between gap-4">
        <label for="score-filter" class="font-heading text-sm font-semibold sm:text-base">最低评分筛选</label>
        <span class="flex items-baseline gap-1">
          <span id="score-value" class="font-heading text-2xl font-bold text-primary">0</span>
          <span class="text-xs text-base-content/50">/ 10</span>
        </span>
      </div>
      <input id="score-filter" type="range" min="0" max="10" value="0" step="1"
             class="range range-primary range-sm mt-3 w-full" aria-label="最低评分" />
      <div class="mt-1 flex w-full justify-between px-1 text-[10px] text-base-content/40">
        <span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span>
      </div>
      <p id="result-count" class="mt-3 text-xs text-base-content/50"></p>
    </div>

    <!-- Loading -->
    <div id="loading" class="mt-12 flex flex-col items-center gap-3 text-base-content/60">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <span>正在加载职位数据…</span>
    </div>

    <!-- Error -->
    <div id="error" class="mt-8 hidden flex-col items-center gap-4 text-center" role="alert">
      <div class="alert alert-error max-w-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
        </svg>
        <span id="error-msg">加载失败</span>
      </div>
      <button id="retry-btn" class="btn btn-primary btn-sm">重试</button>
    </div>

    <!-- Empty -->
    <p id="empty" class="mt-12 hidden text-center text-base-content/50">当前筛选条件下没有职位。</p>

    <!-- List -->
    <div id="job-list" class="mt-6 space-y-3"></div>
  </main>

  <footer class="border-t border-base-300 bg-base-100">
    <div class="mx-auto max-w-5xl px-4 py-6 text-center text-xs text-base-content/50">
      数据来源：Monthly Job Monitor · 每月 1 日自动更新
    </div>
  </footer>

  <script>
    const API_URL = '/api/latest-report';
    let allJobs = [];
    let minScore = 0;

    const $ = (id) => document.getElementById(id);

    function scoreBadgeClass(score) {
      if (score >= 7) return 'badge-accent';
      if (score >= 4) return 'badge-secondary';
      if (score >= 1) return 'badge-warning';
      return 'badge-ghost';
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function renderJobs() {
      const list = $('job-list');
      const visible = allJobs.filter((j) => (j.score ?? 0) >= minScore);
      list.innerHTML = '';
      $('empty').classList.toggle('hidden', visible.length > 0);
      $('result-count').textContent = allJobs.length
        ? `显示 ${visible.length} / ${allJobs.length} 个职位`
        : '';

      for (const job of visible) {
        const score = job.score ?? 0;
        const salary = job.salaryRange || '薪资面议';
        const summary = job.summary ? escapeHtml(job.summary) : '暂无职位描述。';
        const published = job.publishedDate ? escapeHtml(job.publishedDate) : '—';
        const url = job.url || '';

        const item = document.createElement('div');
        item.className = 'job-card collapse collapse-arrow rounded-box border border-base-300 bg-base-100 shadow-sm';
        item.innerHTML = `
          <input type="checkbox" aria-label="展开职位详情" />
          <div class="collapse-title pr-12">
            <div class="flex items-start gap-3">
              <span class="badge ${scoreBadgeClass(score)} badge-lg mt-0.5 font-bold" title="评分 ${score}/10">${score}</span>
              <div class="min-w-0">
                <h3 class="font-heading text-base font-semibold leading-snug sm:text-lg">${escapeHtml(job.title || '未命名职位')}</h3>
                <div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-base-content/70">
                  <span class="inline-flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V7l6-4 6 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>
                    ${escapeHtml(job.company || '未知公司')}
                  </span>
                  <span class="inline-flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
                    ${escapeHtml(job.location || '地点未知')}
                  </span>
                  <span class="badge badge-ghost badge-sm font-medium text-accent">${escapeHtml(salary)}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="collapse-content text-sm">
            <div class="border-t border-base-300 pt-4">
              <p class="whitespace-pre-line leading-relaxed text-base-content/80">${summary}</p>
              <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-xs text-base-content/55">
                <span>来源：${escapeHtml(job.source || 'Job Monitor')}</span>
                <span>发布：${published}</span>
                <span>评分：${score} / 10</span>
              </div>
              ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
                   class="btn btn-primary btn-sm mt-4">申请职位
                   <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
                 </a>` : '<span class="mt-4 inline-block text-xs text-base-content/40">无申请链接</span>'}
            </div>
          </div>`;
        list.appendChild(item);
      }
    }

    $('score-filter').addEventListener('input', (e) => {
      minScore = Number(e.target.value);
      $('score-value').textContent = String(minScore);
      renderJobs();
    });

    $('retry-btn').addEventListener('click', load);

    async function load() {
      $('error').classList.add('hidden');
      $('error').classList.remove('flex');
      $('loading').classList.remove('hidden');
      $('job-list').innerHTML = '';
      try {
        const res = await fetch(API_URL, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          throw new Error('接口未返回 JSON（可能是部署访问保护）');
        }
        const data = await res.json();
        allJobs = Array.isArray(data.jobs) ? data.jobs : [];
        allJobs.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));

        $('stat-date').textContent = data.date || '—';
        $('stat-total').textContent = data.totalJobs ?? allJobs.length;
        $('stat-high').textContent = data.highScoreJobs ?? allJobs.filter((j) => (j.score ?? 0) >= 7).length;

        $('loading').classList.add('hidden');
        renderJobs();
      } catch (err) {
        $('loading').classList.add('hidden');
        $('error').classList.remove('hidden');
        $('error').classList.add('flex');
        $('error-msg').textContent = `加载失败：${err.message}`;
      }
    }

    load();
  </script>
</body>
</html>
